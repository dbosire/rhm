# Installed to /etc/nginx/conf.d/ (http context)
server_tokens off;
# Only POSTs (sign-in attempts / download password checks) are rate limited.
map $request_method $rhm_post_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $rhm_post_limit_key zone=rhm_login:10m rate=20r/m;
limit_req_zone $rhm_post_limit_key zone=rhm_download:10m rate=30r/m;
limit_req_status 429;
