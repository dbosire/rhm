# Installed to /etc/nginx/snippets/rhm-locations.conf – shared by HTTP and HTTPS servers.
client_max_body_size 25m;   # several phone screenshots per request
client_body_timeout 60s;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location /static/ {
    alias __STATIC_ROOT__/;
    gzip_static on;            # serves the .gz files pre-built by collectstatic (WhiteNoise)
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# Private files are never served directly by Nginx.
location ~* ^/(private_media|backups|\.env|\.git) { return 404; }

location = /favicon.ico { access_log off; return 204; }

location = /accounts/login/ {
    limit_req zone=rhm_login burst=5 nodelay;
    include snippets/rhm-proxy.conf;
}

location ~ ^/reports/[0-9a-f-]+/download/$ {
    limit_req zone=rhm_download burst=5 nodelay;
    include snippets/rhm-proxy.conf;
}

location / {
    include snippets/rhm-proxy.conf;
}
