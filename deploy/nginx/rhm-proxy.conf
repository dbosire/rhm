# Installed to /etc/nginx/snippets/rhm-proxy.conf
proxy_pass http://127.0.0.1:8001;   # Gunicorn (localhost only)
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: client-supplied values are not trusted
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_redirect off;
proxy_read_timeout 130s;
proxy_connect_timeout 10s;
proxy_buffering on;
