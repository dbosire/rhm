# RHM Extractor – shared Apache settings, included by the RHM virtual hosts.
# Installed to /etc/apache2/rhm-common.conf (Debian/Ubuntu) or /etc/httpd/rhm-common.conf (RHEL).
# Needs: mod_proxy mod_proxy_http mod_headers mod_rewrite mod_expires mod_deflate (+ mod_ssl for HTTPS)

ServerSignature Off
LimitRequestBody 26214400
TraceEnable Off

# --- Reverse proxy to Gunicorn (localhost only) ---------------------------------
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 130
# Never trust client-supplied forwarding headers; mod_proxy adds the real client IP.
RequestHeader unset X-Forwarded-For
RequestHeader unset X-Forwarded-Host
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# --- Security headers -------------------------------------------------------------
Header unset Server
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# --- Static files served directly by Apache ------------------------------------
Alias /static/ __STATIC_ROOT__/
<Directory __STATIC_ROOT__>
    Require all granted
    Options -Indexes -FollowSymLinks
    AllowOverride None
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
    Header set Cache-Control "public, max-age=2592000, immutable"
</Directory>
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

# Private files are never served by the web server.
<LocationMatch "^/(private_media|backups|\.env|\.git)">
    Require all denied
</LocationMatch>

ProxyPass /static/ !
ProxyPass /.well-known/acme-challenge/ !
ProxyPass / http://127.0.0.1:__APP_PORT__/ retry=0 timeout=130
ProxyPassReverse / http://127.0.0.1:__APP_PORT__/
