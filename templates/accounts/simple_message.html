{% extends "accounts/auth_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block auth %}
<h1>{{ title }}</h1>
<p class="muted">{{ message }}</p>
{% if user.is_authenticated %}
<a class="btn btn-primary btn-block" href="{% url 'core:dashboard' %}">Go to dashboard</a>
{% else %}
<a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Sign in</a>
{% endif %}
{% endblock %}
