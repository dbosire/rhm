{% extends "accounts/auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth %}
<h1>Reset password</h1>
<p class="muted">Enter your account email and we'll send you a reset link.</p>
<form method="post">{% csrf_token %}
  {% include "partials/field.html" with field=form.email %}
  <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
</form>
<p class="subtle" style="margin-top:16px;text-align:center"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
