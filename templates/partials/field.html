<div class="field">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
